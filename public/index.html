<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiranex Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Thiranex<span>Store</span></div>
    <nav>
      <button class="nav-btn" onclick="showSection('shop')">Shop</button>
      <button class="nav-btn" onclick="showSection('orders')">My Orders</button>
      <button class="nav-btn admin-only hidden" onclick="showSection('admin')">Admin</button>
      <button class="nav-btn" id="authBtn" onclick="openAuth()">Login</button>
      <button class="cart-btn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
    </nav>
  </header>

  <main>
    <section id="shop" class="section">
      <div class="hero">
        <div>
          <p class="eyebrow">SMART • SIMPLE • SECURE</p>
          <h1>Everything you need,<br><span>in one place.</span></h1>
          <p>Browse products, add them to your cart and track your orders.</p>
        </div>
        <div class="hero-card">🛍️</div>
      </div>

      <div class="toolbar">
        <input id="search" placeholder="Search products..." oninput="loadProducts()">
        <select id="category" onchange="loadProducts()">
          <option>All</option>
        </select>
      </div>

      <div id="products" class="product-grid"></div>
    </section>

    <section id="orders" class="section hidden">
      <div class="section-head">
        <div>
          <p class="eyebrow">ACCOUNT</p>
          <h2>My Orders</h2>
        </div>
      </div>
      <div id="myOrders"></div>
    </section>

    <section id="admin" class="section hidden admin-panel">
      <div class="section-head">
        <div>
          <p class="eyebrow">ADMIN</p>
          <h2>Store Management</h2>
        </div>
      </div>

      <div class="admin-grid">
        <div class="panel">
          <h3>Add Product</h3>
          <form id="productForm">
            <input name="name" placeholder="Product name" required>
            <input name="price" type="number" min="0" placeholder="Price" required>
            <input name="category" placeholder="Category" required>
            <input name="stock" type="number" min="0" placeholder="Stock" required>
            <input name="image" placeholder="Image URL">
            <textarea name="description" placeholder="Description"></textarea>
            <button class="primary" type="submit">Add Product</button>
          </form>
        </div>

        <div class="panel">
          <h3>All Orders</h3>
          <div id="adminOrders"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="authModal" class="modal hidden">
    <div class="modal-box">
      <button class="close" onclick="closeAuth()">×</button>
      <div class="tabs">
        <button id="loginTab" class="active" onclick="switchAuth('login')">Login</button>
        <button id="registerTab" onclick="switchAuth('register')">Register</button>
      </div>

      <form id="authForm">
        <input id="authName" class="register-field hidden" placeholder="Full name">
        <input id="authEmail" type="email" placeholder="Email" required>
        <input id="authPassword" type="password" placeholder="Password" required>
        <button class="primary" type="submit" id="authSubmit">Login</button>
      </form>
      <p id="authMessage" class="message"></p>
    </div>
  </div>

  <div id="cartModal" class="modal hidden">
    <div class="modal-box cart-box">
      <button class="close" onclick="closeCart()">×</button>
      <h2>Your Cart</h2>
      <div id="cartItems"></div>
      <div class="cart-total">
        <strong>Total</strong>
        <strong id="cartTotal">₹0</strong>
      </div>
      <button class="primary" onclick="openCheckout()">Proceed to Checkout</button>
    </div>
  </div>

  <div id="checkoutModal" class="modal hidden">
    <div class="modal-box">
      <button class="close" onclick="closeCheckout()">×</button>
      <h2>Checkout</h2>
      <form id="checkoutForm">
        <input name="fullName" placeholder="Full name" required>
        <input name="phone" placeholder="Phone number" required>
        <textarea name="address" placeholder="Address" required></textarea>
        <input name="city" placeholder="City" required>
        <input name="pincode" placeholder="Pincode" required>
        <button class="primary" type="submit">Place Order</button>
      </form>
      <p id="checkoutMessage" class="message"></p>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
